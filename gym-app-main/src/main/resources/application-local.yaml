server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/gymapp
    username: postgres
    password: 12345
  jpa:
    hibernate:
      ddl-auto: update
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      roles: USER, ADMIN
      show-details: always

logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{transactionId}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

jwt:
  secret: Dlz1HK5Fze/mIG+cMkrYuDuhfRjU3i0jeN6rRGlOqmw=
  access-expiration: 15

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      workload-service:
        sliding-window-size: 10
        register-health-indicator: true
        wait-duration-in-open-state: 10s
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 3
        event-consumer-buffer-size: 10
        failure-rate-threshold: 50
