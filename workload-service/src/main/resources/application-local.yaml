spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:workload-db

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: workload-service

  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{transactionId}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

