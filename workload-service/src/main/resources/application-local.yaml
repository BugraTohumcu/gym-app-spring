spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:workload-db

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: workload-service

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true