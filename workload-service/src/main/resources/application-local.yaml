spring:
  application:
    name: workload-service

  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

  data:
    mongodb:
      uri: mongodb://localhost:27017/workload-db
      auto-index-creation: true

app:
  activemq:
    queues:
      workload: "workload-service-queue"
      workload-dlq: "workload-dlq"


server:
  port: 8081

logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{transactionId}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

